<!doctype html>
<meta charset="utf-8">
<title>Greenroom dev client</title>
<!-- Throwaway. Phases 1-8 only; the real client is phase 9. Deliberately one
     file with no build step, so there is nothing here to grow attached to. -->
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 18px; }
  button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid #999;
           background: #fff; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: default; }
  #status { margin: 12px 0; color: #666; font-size: 13px; }
  #log { border: 1px solid #ddd; border-radius: 6px; padding: 12px; min-height: 200px;
         white-space: pre-wrap; font: 13px/1.6 ui-monospace, monospace; }
  .me { color: #0a6; }
  .them { color: #24a; }
</style>

<h1>Greenroom — dev client</h1>
<p id="status">idle</p>
<button id="go">Join and talk</button>
<button id="stop" disabled>Leave</button>
<div id="log"></div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.7.2/dist/livekit-client.umd.min.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const say = (who, text) => {
    const d = document.createElement("div");
    d.className = who === "you" ? "me" : "them";
    d.textContent = `${who}: ${text}`;
    $("log").appendChild(d);
  };

  let room;

  $("go").onclick = async () => {
    $("go").disabled = true;
    $("status").textContent = "getting token…";
    try {
      const { token, url } = await (await fetch("/dev/token")).json();

      room = new LivekitClient.Room();
      room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
        if (track.kind === "audio") track.attach().play();
      });
      room.on(LivekitClient.RoomEvent.TranscriptionReceived, (segments, participant) => {
        const who = participant?.isLocal ? "you" : "interviewer";
        segments.filter((s) => s.final).forEach((s) => say(who, s.text));
      });
      room.on(LivekitClient.RoomEvent.Disconnected, () => {
        $("status").textContent = "disconnected";
        $("go").disabled = false;
        $("stop").disabled = true;
      });

      $("status").textContent = "connecting…";
      await room.connect(url, token);
      await room.localParticipant.setMicrophoneEnabled(true);
      $("status").textContent = "connected — start talking";
      $("stop").disabled = false;
    } catch (e) {
      $("status").textContent = "failed: " + e.message;
      $("go").disabled = false;
    }
  };

  $("stop").onclick = () => room && room.disconnect();
</script>
