- id: d2_names_the_constraint
  dimension: D2
  stage: approach
  question: How would you approach it?
  answer: >-
    Sort by start, then sweep and merge - O(n log n), dominated by the sort.
    A brute force pairwise check is O(n squared), and you said up to a million
    intervals, so that's out. If they arrived pre-sorted I'd drop to O(n).
  expected: 5
  why: compares two approaches with complexities and names the constraint that decides

- id: d2_compares_two
  dimension: D2
  stage: approach
  question: How would you approach it?
  answer: >-
    I'd sort then sweep, which is n log n. You could compare every pair
    instead but that's n squared, so sorting is better here.
  expected: 4
  why: two approaches, both complexities, choice justified

- id: d2_one_approach
  dimension: D2
  stage: approach
  question: How would you approach it?
  answer: I'd sort the intervals first and then merge as I go. That's n log n.
  expected: 3
  why: workable approach with its complexity, no alternative considered

