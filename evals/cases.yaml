# Hand-scored answers, the yardstick the scorer is measured against.
#
# HONESTY NOTE, read this before trusting the number it produces.
# These labels were written alongside the rubric and the scorer prompt by the
# same author. That makes them a REGRESSION suite - they catch the scorer
# drifting from its own definition - not an independent measurement of whether
# the rubric is any good. For that, a second person has to score these blind
# and the two label sets have to be compared. Until then, read the agreement
# number as "the scorer still means what it meant", not "the scorer is right".
#
# `why` cites the anchor the label comes from, so a disagreement is arguable
# rather than a matter of taste. If you disagree with a label, change it - the
# labels are the ground truth, and the scorer is what moves.

