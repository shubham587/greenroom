- id: d1_surfaces_ambiguity
  dimension: D1
  stage: problem
  question: Merge all overlapping intervals and return them sorted by start.
  answer: >-
    Before I start - do touching intervals count as overlapping? [1,2] and
    [2,3] could go either way. I'll assume they merge. Can I mutate the input,
    and roughly how many intervals are we talking about?
  expected: 5
  why: surfaces a real ambiguity in the statement, states the assumption, then proceeds

