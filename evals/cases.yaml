- id: d4_diagnoses_from_count
  dimension: D4
  stage: test_run
  question: Eight of ten passed. Two edge cases failed. What do you think is wrong?
  answer: >-
    Two edge failures and the happy paths all passed, so it's boundary
    handling - almost certainly empty input and the single-interval case,
    since I index element zero before checking the length. I'd add a guard
    clause and, generally, write the empty case first next time.
  expected: 5
  why: diagnoses from the failure count alone and says how to prevent the class

- id: d4_predicts_class
  dimension: D4
