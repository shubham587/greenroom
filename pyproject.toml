[project]
name = "greenroom"
version = "0.1.0"
description = "A candidate-side AI voice interviewer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.2",
    "boto3>=1.35",
    "pyyaml>=6.0",
    "openai>=1.57",
    "livekit-agents[openai,silero]>=1.0",
    "onnxruntime<1.21",
    "pypdf>=6.19.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "httpx>=0.28",  # imported by fastapi's TestClient
    "pre-commit>=4.0",
    "pytest-asyncio>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["greenroom"]

[tool.ruff]
line-length = 100
target-version = "py312"
# alembic writes these; style-gating generated migrations is a fight with a
# template that we would lose every time one is regenerated
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

