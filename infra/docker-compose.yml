services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: greenroom
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d greenroom"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible local storage. MinIO was the obvious pick but its images are
  # no longer pullable from Docker Hub or quay.io, so: SeaweedFS, same S3 API.
  # Dev only — production is Cloudflare R2, reached through the same boto3 code.
  s3:
    image: chrislusf/seaweedfs:latest
    # -ip is the address it ADVERTISES; -ip.bind is what it listens on.
    # Without the bind it listens on the s3 hostname alone, Docker's port
    # forward lands on an interface nobody is serving, and the host sees a
    # TCP connect that succeeds followed by an HTTP request that hangs.
    command: server -dir=/data -s3 -s3.port=9000 -ip=s3 -ip.bind=0.0.0.0
    ports: ["9000:9000"]
    volumes: [s3data:/data]
    healthcheck:
      # localhost on purpose: a check against the service name passes even
      # when the bind is wrong and no client outside can reach it, which is
      # a healthcheck lying in the dangerous direction
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/"]
      interval: 5s
      retries: 20

  # --dev mints key "devkey" / secret "secret". Local only, never hosted.
  #
  # --node-ip is load-bearing on Docker Desktop: without it LiveKit advertises
  # its container IP (172.x) as the ICE candidate, the browser cannot route
  # there, and the client fails with "could not establish pc connection".
  # Dev mode also puts all RTC media on a single UDP mux port, 7882 - not the
  # 50000+ range a production config uses, so that is the only port to map.
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  pgdata:
  s3data:
